description = "Анализ темы форума по ссылке, сохранённому HTML или тексту (посты, спойлеры, цитаты, ссылки на видео)"
prompt = """
Проведи разбор темы форума GTA 5 RP (Модуль skills/gta5rp-forum-navigation/):

{{args}}

Форум закрыт для гостей: без входа виден только раздел «Дополнительные правила сервера», суды, прокуратура и законы — только с cookie xf_user.
1. Есть текст темы — работай с ним. Есть сохранённый HTML — extract_thread_content.py --file <путь>. Есть ссылка — extract_thread_content.py <URL> (cookie из переменной GTA5RP_XF_USER).
2. Скрипт вернул код 2 («Форум требует входа» / «cookie не принят») — остановись и предложи пользователю: задать GTA5RP_XF_USER, сохранить страницу как HTML или вставить текст. Не обходи авторизацию веб-поиском. Не проси прислать cookie в чат — это ключ от аккаунта.
3. Структурируй посты, авторов, даты и таймстампы.
4. Раскрой теги [SPOILER] и свернутые цитаты.
5. Извлеки все скрытые ссылки за словами 'тык', 'клик', 'доказательства', 'запись'.
6. Сгруппируй медиа-улики: видео (YouTube/Rutube с таймкодами), фото (Imgur/Yapx), документы (Google Docs/Sheets).
"""
