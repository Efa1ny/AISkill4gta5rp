description = "Процессуальный аудит иска или обращения по ссылке на тему форума (форма, пошлина, сроки, MG, определение)"
prompt = """
Проведи полный процессуальный и юридический аудит искового заявления или обращения по ссылке на тему форума GTA 5 RP (Модули skills/gta5rp-forum-documents/ и skills/gta5rp-forum-navigation/):

{{args}}

Каждую статью Судебного кодекса сверяй скриптом search_mirror_law.py --law СК --article <номер>; при расхождении прав скрипт.

1. Извлеки тему форума (или используй текст иска).
2. Проверь форму по ст. 19.1–19.2 СК: заголовок «Исковое заявление №», суд, данные сторон, копия паспорта, суть и дата событий, доказательства, тайм-коды к видео длиннее 5 минут, дата, подпись.
3. Проверь пошлину (гл. 39 СК): чек перевода Председателю ВС, предел $30.000 (Окружной) / $60.000 (Верховный); нет чека — без движения (ст. 20.5 п. 3).
4. Проверь давность (гл. 17 СК): 72ч гражданские и административные (17.3), 48ч незаконное задержание (17.4), 72ч привлечение к ответственности (17.5); штраф оспаривается после уплаты (18.5). Истёк срок — отказ (20.1 п. 1).
5. Сроки суда: определение 24ч (17.9), исправление недостатков не менее 24ч (20.6), расследование до 4 дней (23.2), рассмотрение до 14 дней (17.11), апелляция и кассация 24ч (33.6, 34.5).
6. Отметь MetaGaming (MG): 'откат', 'деморган', 'варн', 'админ', 'статик' без #. MG — нарушение OOC-правил, но не процессуальное основание отказа по СК.
7. Подсудность: Окружной Суд — все гражданские и трудовые споры независимо от статуса ответчика (5.2); Верховный Суд — уголовные и административные дела против лиц из ст. 7.2, иски к штату, конституционные дела. Ошибка подсудности — передача дела (5.6, 7.5), а не отказ.
8. Выдай вердикт и проект Определения суда.
"""
