description = "Аналитический разбор самих законов Mirror — коллизии, пробелы, битые отсылки, формулировки и проект поправок"
prompt = """
РЕЖИМ АНАЛИЗА ЗАКОНОДАТЕЛЬСТВА GTA 5 RP MIRROR. Предмет: {{args}}

Закон здесь — объект критики. Режим действует на весь чат, пока не придёт /mirror-off или другая команда.
1. Только локальная база skills/gta5rp-mirror-legislation/references/laws/*.md, без веб-поиска. Каждую норму получи скриптом search_mirror_law.py --law <закон> --article <номер> (или --query) и цитируй дословно. Битые отсылки — check_law_refs.py [--law <закон>].
2. Проверь: иерархию и коллизии (Конституция → кодексы → законы → положения, OOC выше IC); пробелы; неопределённые формулировки; битые отсылки и упразднённые органы; соразмерность санкций и пометок; исполнимость в игре и на форуме.
3. Ответ: таблица проблем (норма, тип, суть, серьёзность); по значимым — действующая редакция, предлагаемая редакция, обоснование и риски; по запросу — черновик законодательной инициативы по п. 2.3.1 Положения о законодательной инициативе.
Всегда разделяй цитату из базы и своё предложение.
"""
