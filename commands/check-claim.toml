description = "Аудит судебного иска или обращения в прокуратуру (форма, пошлина, сроки SLA, MG, определение)"
prompt = """
Проведи полный процессуальный и юридический аудит искового заявления или обращения по правилам GTA 5 RP Mirror (Модуль skills/gta5rp-forum-documents/):

$ARGUMENTS

1. Проверь форму (заголовок, данные сторон, ксерокопия паспорта, дата, подпись).
2. Проверь оплату судебной пошлины (чек банка).
3. Проверь сроки SLA: давность иска (48ч штрафы / 96ч аресты) и срок суда (24ч на определение).
4. Проверь на MetaGaming (MG): слова 'откат', 'деморган', 'варн', 'админ', 'статик' без #.
5. Определи подсудность (Окружной FJ / Верховный SJ).
6. Выдай вердикт и проект судебного Определения или акта Прокуратуры.
"""
